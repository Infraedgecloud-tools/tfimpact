name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        shell: bash
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "These files are not gofmt-clean:"
            echo "$out"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      # Pinned like the actions are: a tool that updates itself under CI is a
      # check whose meaning changes on a Tuesday.
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: test
        run: go test -race -coverprofile=coverage.out ./...
      - name: coverage
        run: go tool cover -func=coverage.out | tail -1

  # The suite on the other two operating systems the binaries ship for, not
  # just a build: path handling and the saved-plan shell-out differ there.
  test-os:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test ./...

  # What a release would do, without publishing: the goreleaser config is
  # valid, every target builds, the archives and packages render, and the
  # container image builds. A broken release config used to be found by the
  # tag that tried to use it.
  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: '~> v2'
          args: check
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: '~> v2'
          args: release --snapshot --clean --skip=publish,sign,sbom
      - name: The snapshot binary runs
        run: ./dist/tfimpact_linux_amd64_v1/tfimpact explain testdata/plans/noisy/plan.json --format text
      - name: Container image builds
        run: docker build --build-arg VERSION=ci -t tfimpact:ci .
      - name: Container image runs
        run: docker run --rm -v "$PWD/testdata/plans/noisy:/work:ro" -w /work tfimpact:ci explain plan.json --format text

  # The composite action, as a user's workflow would call it, against the
  # bundled fixture. It downloads the latest release, so it also notices a
  # release whose assets are not where the action looks.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./
        with:
          plan: testdata/plans/noisy/plan.json
          comment: 'false'
          fail-on: none
