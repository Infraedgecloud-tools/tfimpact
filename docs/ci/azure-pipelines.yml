# Add this step after the step that writes plan.json.
# Set VERSION to the release you want, without the leading v.
variables:
  TFIMPACT_VERSION: '1.0.0'

steps:
  - script: |
      set -euo pipefail
      v="$(TFIMPACT_VERSION)"
      base="https://github.com/infraedge-tools/tfimpact/releases/download/v${v}"
      mkdir -p "$(Agent.TempDirectory)/tfimpact"
      cd "$(Agent.TempDirectory)/tfimpact"
      curl -fsSL -O "${base}/tfimpact_${v}_linux_amd64.tar.gz"
      curl -fsSL -O "${base}/checksums.txt"
      sha256sum -c --ignore-missing checksums.txt
      tar -xzf "tfimpact_${v}_linux_amd64.tar.gz"
      cd "$(System.DefaultWorkingDirectory)"
      "$(Agent.TempDirectory)/tfimpact/tfimpact" explain plan.json --format markdown \
        --output "$(Build.ArtifactStagingDirectory)/summary.md" --fail-on high
    displayName: tfimpact explain
  - task: PublishBuildArtifacts@1
    condition: always()
    inputs:
      PathtoPublish: '$(Build.ArtifactStagingDirectory)/summary.md'
      ArtifactName: tfimpact
