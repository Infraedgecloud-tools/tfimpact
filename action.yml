name: tfimpact
description: Explain what a Terraform or OpenTofu plan will do to your AWS resources
author: InfraEdge
branding:
  icon: alert-triangle
  color: orange

inputs:
  plan:
    description: Path to the plan JSON produced by `terraform show -json` or `tofu show -json`.
    required: true
  version:
    description: >-
      tfimpact release to install, for example 1.2.3. The default, latest, installs the newest
      release. Pin a version in your workflow so a new release cannot change your results.
    required: false
    default: latest
  fail-on:
    description: Fail the step when an unsuppressed finding reaches this severity (none, low, medium, high, critical).
    required: false
    default: none
  comment:
    description: Post or update one pull request comment with the summary.
    required: false
    default: 'true'
  no-values:
    description: Do not print attribute values in the report.
    required: false
    default: 'false'
  working-directory:
    description: >-
      Directory to run in. Set it to the configuration's directory when `plan` is the
      saved plan file rather than its JSON, so `terraform show -json` can read it.
    required: false
    default: '.'
  config:
    description: Path to a .tfimpact.toml suppressions file. The default is .tfimpact.toml in the working directory, if present.
    required: false
    default: ''

outputs:
  summary-markdown:
    description: Path to the Markdown summary.
    value: ${{ steps.explain.outputs.summary-markdown }}
  findings-json:
    description: Path to the JSON findings file.
    value: ${{ steps.explain.outputs.findings-json }}
  exit-code:
    description: Exit code of tfimpact explain (0 ok, 1 findings reached fail-on, 2 usage or parse error).
    value: ${{ steps.explain.outputs.exit-code }}
  sarif:
    description: Path to a SARIF 2.1.0 log of the findings, for github/codeql-action/upload-sarif.
    value: ${{ steps.explain.outputs.sarif }}

runs:
  using: composite
  steps:
    - name: Install tfimpact
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        GH_TOKEN: ${{ github.token }}
        RUNNER_OS_NAME: ${{ runner.os }}
        RUNNER_ARCH_NAME: ${{ runner.arch }}
      run: |
        set -euo pipefail
        case "$RUNNER_OS_NAME" in
          Linux) os=linux ;;
          macOS) os=darwin ;;
          *) echo "tfimpact action supports Linux and macOS runners, got $RUNNER_OS_NAME" >&2; exit 1 ;;
        esac
        case "$RUNNER_ARCH_NAME" in
          X64) arch=amd64 ;;
          ARM64) arch=arm64 ;;
          *) echo "unsupported architecture $RUNNER_ARCH_NAME" >&2; exit 1 ;;
        esac
        dest="$RUNNER_TEMP/tfimpact"
        dl="$RUNNER_TEMP/tfimpact-download"
        rm -rf "$dest" "$dl"
        mkdir -p "$dest" "$dl"
        if [ "$VERSION" = "latest" ]; then
          gh release download -R infraedgecloud-tools/tfimpact -D "$dl" \
            --pattern "tfimpact_*_${os}_${arch}.tar.gz" --pattern checksums.txt
        else
          v="${VERSION#v}"
          base="https://github.com/infraedgecloud-tools/tfimpact/releases/download/v${v}"
          curl -fsSL -o "$dl/tfimpact_${v}_${os}_${arch}.tar.gz" "${base}/tfimpact_${v}_${os}_${arch}.tar.gz"
          curl -fsSL -o "$dl/checksums.txt" "${base}/checksums.txt"
        fi
        (cd "$dl" && if command -v sha256sum >/dev/null 2>&1; then sha256sum -c --ignore-missing checksums.txt; else shasum -a 256 -c --ignore-missing checksums.txt; fi)
        tar -xzf "$dl"/tfimpact_*_"${os}"_"${arch}".tar.gz -C "$dest"
        chmod +x "$dest/tfimpact"

    - name: Explain plan
      id: explain
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PLAN: ${{ inputs.plan }}
        FAIL_ON: ${{ inputs.fail-on }}
        NO_VALUES: ${{ inputs.no-values }}
        CONFIG: ${{ inputs.config }}
      run: |
        dir="$RUNNER_TEMP/tfimpact"
        args=(explain "$PLAN" --format markdown
          --output "$dir/summary.md" --json "$dir/findings.json" --fail-on "$FAIL_ON")
        # The action may be running a release older than this file. Flags
        # that release does not know would make it print usage and exit 2.
        if "$dir/tfimpact" help 2>&1 | grep -q -- '--sarif'; then
          args+=(--sarif "$dir/results.sarif")
        fi
        if [ "$NO_VALUES" = "true" ]; then args+=(--no-values); fi
        if [ -n "$CONFIG" ]; then args+=(--config "$CONFIG"); fi
        set +e
        "$dir/tfimpact" "${args[@]}"
        code=$?
        set -e
        {
          echo "summary-markdown=$dir/summary.md"
          echo "findings-json=$dir/findings.json"
          echo "sarif=$dir/results.sarif"
          echo "exit-code=$code"
        } >> "$GITHUB_OUTPUT"
        if [ -f "$dir/summary.md" ]; then
          cat "$dir/summary.md" >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Comment on pull request
      if: inputs.comment == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        if [ -f "$RUNNER_TEMP/tfimpact/summary.md" ]; then
          "$RUNNER_TEMP/tfimpact/tfimpact" comment --body "$RUNNER_TEMP/tfimpact/summary.md"
        fi

    - name: Apply exit code
      shell: bash
      env:
        EXIT_CODE: ${{ steps.explain.outputs.exit-code }}
      run: |
        if [ "${EXIT_CODE:-0}" != "0" ]; then
          exit "$EXIT_CODE"
        fi
