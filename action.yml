name: tfimpact
description: Explain what a Terraform or OpenTofu plan will do to your AWS resources
author: InfraEdge
branding:
  icon: alert-triangle
  color: orange

inputs:
  plan:
    description: Path to the plan JSON produced by `terraform show -json` or `tofu show -json`.
    required: true
  version:
    description: >-
      Exact tfimpact release to install, for example 0.2.0. Moving labels are rejected.
      Pin the Action source SHA as well as the binary version.
    required: false
    default: '0.2.0'
  verify-provenance:
    description: >-
      Require GitHub build attestation from this repository's release workflow and exact tag.
      Every published release carries one. Release checksums alone detect corruption;
      they do not establish provenance.
    required: false
    default: 'true'
  fail-on:
    description: Fail the step when an unsuppressed finding reaches this severity (none, low, medium, high, critical).
    required: false
    default: none
  comment:
    description: Post or update one pull request comment with the summary.
    required: false
    default: 'false'
  no-values:
    description: Do not print attribute values in the report.
    required: false
    default: 'false'
  working-directory:
    description: >-
      Directory used to resolve the plan JSON and optional configuration paths.
      This Action accepts show-JSON only and never runs a saved-plan helper.
    required: false
    default: '.'
  config:
    description: Path to a .tfimpact.toml suppressions file. The default is .tfimpact.toml in the working directory, if present.
    required: false
    default: ''

outputs:
  summary-markdown:
    description: Path to the Markdown summary.
    value: ${{ steps.explain.outputs.summary-markdown }}
  findings-json:
    description: Path to the JSON findings file.
    value: ${{ steps.explain.outputs.findings-json }}
  exit-code:
    description: Exit code of tfimpact explain (0 ok, 1 findings reached fail-on, 2 usage or parse error).
    value: ${{ steps.explain.outputs.exit-code }}
  sarif:
    description: Path to a SARIF 2.1.0 log of the findings, for github/codeql-action/upload-sarif.
    value: ${{ steps.explain.outputs.sarif }}

runs:
  using: composite
  steps:
    - name: Install tfimpact
      id: install
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        VERIFY_PROVENANCE: ${{ inputs.verify-provenance }}
        GH_TOKEN: ${{ github.token }}
        RUNNER_OS_NAME: ${{ runner.os }}
        RUNNER_ARCH_NAME: ${{ runner.arch }}
      run: |
        set -euo pipefail
        case "$RUNNER_OS_NAME" in
          Linux) os=linux ;;
          macOS) os=darwin ;;
          *) echo "tfimpact action supports Linux and macOS runners, got $RUNNER_OS_NAME" >&2; exit 1 ;;
        esac
        case "$RUNNER_ARCH_NAME" in
          X64) arch=amd64 ;;
          ARM64) arch=arm64 ;;
          *) echo "unsupported architecture $RUNNER_ARCH_NAME" >&2; exit 1 ;;
        esac
        v="${VERSION#v}"
        if [[ ! "$v" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
          echo "version must be an exact stable semantic version" >&2; exit 2
        fi
        case "$VERIFY_PROVENANCE" in true|false) ;; *) echo "verify-provenance must be true or false" >&2; exit 2 ;; esac
        dest=$(mktemp -d "$RUNNER_TEMP/tfimpact.XXXXXXXX")
        dl=$(mktemp -d "$RUNNER_TEMP/tfimpact-download.XXXXXXXX")
        trap 'rm -rf "$dl"' EXIT
        archive="tfimpact_${v}_${os}_${arch}.tar.gz"
        base="https://github.com/infraedgecloud-tools/tfimpact/releases/download/v${v}"
        curl --proto '=https' --tlsv1.2 --connect-timeout 15 --max-time 120 -fsSL -o "$dl/$archive" "$base/$archive"
        curl --proto '=https' --tlsv1.2 --connect-timeout 15 --max-time 60 -fsSL -o "$dl/checksums.txt" "$base/checksums.txt"
        # Verify exactly the selected archive; unrelated checksum entries do not count.
        python3 - "$dl" "$archive" <<'PYVERIFY'
        import hashlib, pathlib, sys
        root, name = pathlib.Path(sys.argv[1]), sys.argv[2]
        entries = [line.split() for line in (root / 'checksums.txt').read_text().splitlines()]
        matches = [row[0] for row in entries if len(row) == 2 and row[1] == name]
        if len(matches) != 1 or hashlib.sha256((root / name).read_bytes()).hexdigest() != matches[0]:
            raise SystemExit('selected archive checksum missing, duplicated or mismatched')
        PYVERIFY
        if [ "$VERIFY_PROVENANCE" = true ]; then
          # --cert-identity pins the signing workflow and the exact tag, so
          # --signer-workflow would say the same thing again; gh rejects both
          # together.
          gh attestation verify "$dl/$archive" --repo Infraedgecloud-tools/tfimpact \
            --source-ref "refs/tags/v${v}" \
            --cert-identity "https://github.com/Infraedgecloud-tools/tfimpact/.github/workflows/release.yml@refs/tags/v${v}"
        fi
        # Stream only the named executable: never extract archive-controlled paths.
        tar -xOzf "$dl/$archive" tfimpact > "$dest/tfimpact"
        chmod +x "$dest/tfimpact"
        "$dest/tfimpact" version | grep -Eq "^tfimpact v?${v//./\.}([[:space:]]|$)"
        echo "dir=$dest" >> "$GITHUB_OUTPUT"

    - name: Explain plan
      id: explain
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INSTALL_DIR: ${{ steps.install.outputs.dir }}
        PLAN: ${{ inputs.plan }}
        FAIL_ON: ${{ inputs.fail-on }}
        NO_VALUES: ${{ inputs.no-values }}
        CONFIG: ${{ inputs.config }}
      run: |
        dir="$INSTALL_DIR"
        if [ ! -f "$PLAN" ]; then echo "plan must be a regular show-JSON file" >&2; exit 2; fi
        args=(explain - --format markdown
          --output "$dir/summary.md" --json "$dir/findings.json" --fail-on "$FAIL_ON")
        # The action may be running a release older than this file. Flags
        # that release does not know would make it print usage and exit 2.
        if "$dir/tfimpact" help 2>&1 | grep -q -- '--sarif'; then
          args+=(--sarif "$dir/results.sarif")
        fi
        if [ "$NO_VALUES" = "true" ]; then args+=(--no-values); fi
        if [ -n "$CONFIG" ]; then args+=(--config "$CONFIG"); fi
        set +e
        "$dir/tfimpact" "${args[@]}" < "$PLAN"
        code=$?
        set -e
        {
          echo "summary-markdown=$dir/summary.md"
          echo "findings-json=$dir/findings.json"
          if [ -f "$dir/results.sarif" ]; then echo "sarif=$dir/results.sarif"; else echo "sarif="; fi
          echo "exit-code=$code"
        } >> "$GITHUB_OUTPUT"
        if [ -f "$dir/summary.md" ]; then
          cat "$dir/summary.md" >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Comment on pull request
      if: inputs.comment == 'true' && github.event_name == 'pull_request'
      shell: bash
      continue-on-error: true
      env:
        INSTALL_DIR: ${{ steps.install.outputs.dir }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        if [ -f "$INSTALL_DIR/summary.md" ]; then
          "$INSTALL_DIR/tfimpact" comment --body "$INSTALL_DIR/summary.md"
        fi

    - name: Apply exit code
      if: always() && steps.explain.outputs.exit-code != ''
      shell: bash
      env:
        EXIT_CODE: ${{ steps.explain.outputs.exit-code }}
      run: |
        if [ "${EXIT_CODE:-0}" != "0" ]; then
          exit "$EXIT_CODE"
        fi
