type = "aws_cloudwatch_log_group"
display = "CloudWatch log group"
doc = "https://registry.terraform.io/providers/hashicorp/aws/latest/docs/resources/cloudwatch_log_group"
holds_data = true
data = "every stored log event"
# Losing a log group's events is real, but it is not losing a database:
# decommissioning a function deletes its log group, and a critical finding
# there blocks every such change behind --fail-on high.
data_severity = "medium"
identity = ["name"]

[[safeguard]]
attr = "skip_destroy"
equals = true
keeps_data = true
message = "`skip_destroy` = true, so the log group is only removed from state and its events stay in AWS"
