type = "aws_secretsmanager_secret"
display = "Secrets Manager secret"
doc = "https://registry.terraform.io/providers/hashicorp/aws/latest/docs/resources/secretsmanager_secret"
holds_data = true
data = "the secret value and all its versions"
identity = ["name"]

[[mitigation]]
attr = "recovery_window_in_days"
equals = 0
message = "recovery_window_in_days = 0, so the secret is deleted immediately with no way to restore it"

[[safeguard]]
attr = "recovery_window_in_days"
absent = true
message = "the default 30-day recovery window applies, so the secret can be restored in that time"

[[policy]]
attr = "policy"
kind = "resource"
