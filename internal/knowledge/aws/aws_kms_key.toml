type = "aws_kms_key"
display = "KMS key"
doc = "https://registry.terraform.io/providers/hashicorp/aws/latest/docs/resources/kms_key"
holds_data = true
data = "the key material"
loss_note = "Once the key is deleted, everything encrypted with it (volumes, snapshots, objects, secrets) can never be decrypted again."

[[mitigation]]
attr = "deletion_window_in_days"
equals = 7
message = "the deletion window is the minimum 7 days"

[[safeguard]]
attr = "deletion_window_in_days"
absent = true
message = "the default 30-day deletion window applies; cancel the scheduled deletion in that time to keep the key"

[[safeguard]]
attr = "deletion_window_in_days"
at_least = 8
message = "the deletion window is longer than the minimum (`deletion_window_in_days`); cancel the scheduled deletion in that time to keep the key"

[[flag]]
attr = "enable_key_rotation"
unsafe = false
message = "automatic key rotation is being turned off"
severity = "low"
# Rotation exists for symmetric encryption keys only; an asymmetric or HMAC
# key cannot rotate, so the flag would fire on every one of them.
[flag.only]
attr = "customer_master_key_spec"
equals = "SYMMETRIC_DEFAULT"
message = "symmetric encryption key"

[[policy]]
attr = "policy"
kind = "resource"
