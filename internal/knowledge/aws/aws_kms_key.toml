type = "aws_kms_key"
display = "KMS key"
doc = "https://registry.terraform.io/providers/hashicorp/aws/latest/docs/resources/kms_key"
holds_data = true
data = "the key material; once the key is deleted, everything encrypted with it (volumes, snapshots, objects, secrets) can never be decrypted again"

[[mitigation]]
attr = "deletion_window_in_days"
equals = 7
message = "the deletion window is the minimum 7 days"

[[safeguard]]
attr = "deletion_window_in_days"
absent = true
message = "the default 30-day deletion window applies; cancel the scheduled deletion in that time to keep the key"

[[safeguard]]
attr = "deletion_window_in_days"
equals = 30
message = "a 30-day deletion window applies; cancel the scheduled deletion in that time to keep the key"

[[flag]]
attr = "enable_key_rotation"
unsafe = false
message = "automatic key rotation is being turned off"
severity = "low"

[[policy]]
attr = "policy"
kind = "resource"
