type = "aws_iam_account_password_policy"
display = "IAM account password policy"
doc = "https://registry.terraform.io/providers/hashicorp/aws/latest/docs/resources/iam_account_password_policy"

[delete]
severity = "medium"
message = "the account's password policy reverts to the AWS defaults (no complexity, no rotation, no reuse prevention)"

[[flag]]
attr = "minimum_password_length"
unsafe = 8
message = "the minimum password length drops to the AWS default of 8"
severity = "low"
