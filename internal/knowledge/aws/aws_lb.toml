type = "aws_lb"
display = "load balancer"
doc = "https://registry.terraform.io/providers/hashicorp/aws/latest/docs/resources/lb"
identity = ["name"]
downtime_on_replace = true
downtime = "the load balancer gets a new DNS name and new IP addresses; CNAME records, alias records in other zones and anything pinned to the old addresses break, and listeners and target group attachments are recreated"

[[flag]]
attr = "internal"
unsafe = false
message = "the load balancer becomes internet-facing"
severity = "high"

[[flag]]
attr = "drop_invalid_header_fields"
unsafe = false
message = "invalid HTTP headers are no longer dropped"
severity = "low"
